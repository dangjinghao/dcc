<!--
	From: https://echarts.apache.org/examples/en/editor.html?c=tree-legend&edit=1&reset=1
-->
<!DOCTYPE html>
<html lang="en" style="height: 100%">

<head>
  <meta charset="utf-8">
</head>

<body style="height: 100%; margin: 0">



  <div id="container" style="height: 100%"></div>
  <div class="ident-table">
  </div>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>

  <script type="text/javascript">
    var dom = document.getElementById('container');
    var myChart = echarts.init(dom, null, {
      renderer: 'canvas',
      useDirtyRect: false
    });
    var app = {};
    var option = {
      tooltip: {
        trigger: 'item',
        triggerOn: 'mousemove'
      },
      legend: {
        top: '2%',
        left: '3%',
        orient: 'vertical',
        data: [
          {
            name: 'AST',
            icon: 'rectangle'
          },
        ],
        borderColor: '#c23531'
      },
      series: [
        {
          type: 'tree',
          name: 'AST',
          data: [],
          top: '5%',
          left: '7%',
          bottom: '2%',
          right: '60%',
          symbolSize: 7,
          label: {
            position: 'left',
            verticalAlign: 'middle',
            align: 'right'
          },
          leaves: {
            label: {
              position: 'right',
              verticalAlign: 'middle',
              align: 'left'
            }
          },
          emphasis: {
            focus: 'descendant'
          },
          expandAndCollapse: true,
          animationDuration: 550,
          animationDurationUpdate: 750,
          roam: true,
        },
      ]
    };

    myChart.showLoading();
    fetch("data.json").then(res => res.json()).then(data => {

      option.series[0].data = [data];

      myChart.hideLoading();
      myChart.setOption(
        option
      );

      if (option && typeof option === 'object') {
        myChart.setOption(option);
      }

      window.addEventListener('resize', myChart.resize);
    });

  </script>
</body>

</html>
